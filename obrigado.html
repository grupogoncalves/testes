<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Pedido recebido</title>
  <style>
    body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#130817;color:#fff;padding:24px}
    .card{max-width:520px;background:linear-gradient(160deg,#28102e,#170c1e);border:1px solid rgba(255,255,255,.12);box-shadow:0 30px 80px rgba(0,0,0,.45);border-radius:28px;padding:34px;text-align:center}
    h1{font-size:clamp(28px,8vw,44px);margin:0 0 12px}.badge{display:inline-block;background:#3cffaa;color:#092015;padding:8px 12px;border-radius:999px;font-weight:900;margin-bottom:18px}.btn{display:inline-flex;margin-top:22px;background:#ff3e8a;color:white;text-decoration:none;font-weight:900;border-radius:999px;padding:15px 22px}
    p{color:#d8c5df;line-height:1.55}
  </style>
</head>
<body>
  <main class="card">
    <span class="badge">Pagamento concluído ou em processamento</span>
    <h1>Pedido recebido 💕</h1>
    <p>Se o pagamento foi aprovado, sua compra já entrou na fila de separação. Você receberá os próximos passos pelo e-mail ou WhatsApp informado.</p>
    <a class="btn" href="/">Voltar para a loja</a>
  </main>
</body>
</html>
